executionPrerequisite: >-
  App on Home after the intro scroll; this segment taps into the review queue
  and approves a post.

steps:
  - echo: Preview segment 2 — Queue: show the AI plan, then approve the first post.
  - tap:
      text: Queue
  - await:
      visible:
        text: Review queue
  - wait: 1300
  - await:
      idle: true
  - tap:
      text: Approve
  - wait: 1200
  - await:
      idle: true
